    <script>
      // Stamp the saved theme before the app bundle loads so dark-mode users
      // never see a light flash while the JS parses.
      try {
        var t = localStorage.getItem('el-libro-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.documentElement.style.backgroundColor = '#211f1c';
      } catch (e) { /* ignore */ }
    </script>
